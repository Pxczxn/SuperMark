spring:
  application:
    name: supermark-backend
  datasource:
    url: jdbc:h2:file:./data/supermark;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  sql:
    init:
      mode: always
    defer-datasource-initialization: true

server:
  port: 8080

jwt:
  secret: supermark-default-secret-key-change-me-in-production-2026
  expiration: 86400

logging:
  level:
    org.hibernate.SQL: warn
